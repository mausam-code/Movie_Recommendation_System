{% extends 'base.html' %}

{% block content %}
<h1>Welcome to Movie Reservation System</h1>
<p class="lead">Explore upcoming movies and book your seats!</p>

<h3>🎬 Available Movies</h3>
<ul class="list-group">
    {% for movie in movies %}
        <li class="list-group-item">{{ movie.title }} - {{ movie.genre.name }}</li>
    {% empty %}
        <li class="list-group-item">No movies yet.</li>
    {% endfor %}
</ul>
{% endblock %}
